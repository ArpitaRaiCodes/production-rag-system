services:
  rag:
    build: .
    container_name: personal-rag
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /srv/data
      CHROMA_DIR: /srv/data/chroma
      UPLOAD_DIR: /srv/data/uploads
      HF_HOME: /models
    volumes:
      # your documents and embeddings survive container rebuilds
      - ./data:/srv/data
      # model weights are downloaded once and reused
      - hf-models:/models
    restart: unless-stopped

    # Uncomment for an NVIDIA GPU (needs nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  hf-models:
